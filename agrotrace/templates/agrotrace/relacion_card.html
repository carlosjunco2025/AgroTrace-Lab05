{# Componente reutilizable para mostrar relaciones intermedias N:M #}
<div class="card shadow-sm mb-3 border-success">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold text-success mb-1">{{ item.nombre|upper }}</h6>
                <small class="text-muted">Registro ID: {{ item.id }}</small>
            </div>
            <span class="badge bg-success rounded-pill">Activo</span>
        </div>
    </div>
</div>
