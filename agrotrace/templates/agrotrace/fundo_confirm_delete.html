{% extends 'agrotrace/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">{{ title }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre del Fundo:</label>
                        {{ form.nombre_fundo }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DNI / RUC Propietario:</label>
                        {{ form.propietario_dni_ruc }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hectáreas:</label>
                        {{ form.hectareas }}
                    </div>
                    <div class="form-check mb-4">
                        {{ form.valido_exportacion }}
                        <label class="form-check-label">Válido para Exportación</label>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'agrotrace:fundo_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Registro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
